name: Auditoria Diaria de Saude do Sistema

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 em Brasilia (UTC-3)
  workflow_dispatch:

jobs:
  auditoria:
    name: Checar saude do sistema e enviar e-mail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Executar auditoria diaria
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/auditoria_diaria.py
