name: Auditoria Diaria de Saude do Sistema

on:
  schedule:
    # Minuto deslocado (nao ":00") de proposito: cron exatamente em hora cheia disputa fila
    # com todo mundo no GitHub Actions e pode atrasar horas ou nem rodar - foi exatamente o
    # que aconteceu aqui, esse e-mail nunca disparou desde que foi criado em 2026-09-15
    # porque cada execucao ficava na fila do "0 10 * * *" e o job nunca chegava a iniciar.
    - cron: '48 9 * * *'   # ~07:48 em Brasilia (UTC-3), pouco depois do sync das 3h em 6h/9h
  workflow_dispatch:

jobs:
  auditoria:
    name: Checar saude do sistema e enviar e-mail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Executar auditoria diaria
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/auditoria_diaria.py
