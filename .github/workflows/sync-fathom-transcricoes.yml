name: Fathom -> Transcricoes

on:
  schedule:
    - cron: '7 * * * *'   # a cada hora - mesmo horario da antiga rotina no Claude
  workflow_dispatch:

jobs:
  fathom-transcricoes:
    name: Gmail (Fathom) -> Supabase + Gemini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests supabase google-genai
      - name: Executar coletor Fathom
        env:
          GMAIL_ADDRESS:         ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          FATHOM_API_KEY:        ${{ secrets.FATHOM_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
        run: python collectors/fathom_transcricoes.py
