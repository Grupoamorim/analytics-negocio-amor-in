name: Sincronizacao Financeira SGE

on:
  schedule:
    - cron: '0 */12 * * *'   # a cada 12h (00:00 e 12:00 UTC = 21:00 e 09:00 em Brasilia)
  workflow_dispatch:

jobs:
  sync-sge:
    name: SGE API -> Supabase (financeiro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests supabase python-dotenv google-genai
      - name: Executar coletor SGE
        env:
          SGE_CNPJ:             ${{ secrets.SGE_CNPJ }}
          SGE_TOKEN:            ${{ secrets.SGE_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/sge_collector.py
      - name: Classificar novas despesas por IA (Gemini)
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/ia_classificador.py
