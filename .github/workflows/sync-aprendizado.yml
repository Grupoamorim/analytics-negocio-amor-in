name: Estudo de Aprendizado por Curso/Faculdade

on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda-feira 06:00 UTC
  workflow_dispatch:

jobs:
  aprendizado:
    name: Recalcula agregados + sintese IA por curso e faculdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Executar estudo de aprendizado
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:         ${{ secrets.GEMINI_MODEL }}
        run: python collectors/aprendizado_estudo.py
