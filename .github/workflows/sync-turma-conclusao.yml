name: Conclusao Automatica de Turma + Turma Seguinte

on:
  schedule:
    - cron: '0 9 * * *'   # 1x por dia, 09:00 UTC (06:00 horario de Brasilia)
  workflow_dispatch:

jobs:
  turma-conclusao:
    name: Marca turmas concluidas e cria a turma seguinte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install supabase
      - name: Executar conclusao automatica de turmas
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/turma_conclusao.py
