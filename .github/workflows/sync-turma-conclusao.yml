name: Conclusao Automatica de Turma + Turma Seguinte

on:
  schedule:
    - cron: '34 8 * * *'   # 1x por dia, ~08:34 UTC (05:34 em Brasilia) - minuto deslocado de
                            # proposito, cron em hora cheia disputa fila de pico do GitHub Actions
  workflow_dispatch:

jobs:
  turma-conclusao:
    name: Marca turmas concluidas e cria a turma seguinte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Executar conclusao automatica de turmas
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collectors/turma_conclusao.py
